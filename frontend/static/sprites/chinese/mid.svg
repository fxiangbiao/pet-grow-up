<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 诗灵 - Evolved poetic spirit -->
  <defs>
    <radialGradient id="body" cx="50%" cy="50%"><stop offset="0%" stop-color="#FFF8E1"/><stop offset="100%" stop-color="#FFE0B2"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%"><stop offset="0%" stop-color="#FFD54F" stop-opacity="0.4"/><stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="100" cy="125" rx="80" ry="25" fill="#FFD54F" opacity="0.12"/>
  <!-- Elegant body -->
  <ellipse cx="100" cy="115" rx="45" ry="50" fill="url(#body)" stroke="#8D6E63" stroke-width="2.5"/>
  <!-- Wings -->
  <path d="M55 85 Q20 60 35 40 Q55 55 58 80" fill="#FFF9C4" stroke="#FFC107" stroke-width="1.5"/>
  <path d="M145 85 Q180 60 165 40 Q145 55 142 80" fill="#FFF9C4" stroke="#FFC107" stroke-width="1.5"/>
  <!-- Floating scrolls around -->
  <rect x="30" y="130" width="18" height="14" rx="1" fill="#FFECB3" stroke="#FFB300" stroke-width="1" transform="rotate(-20 39 137)" opacity="0.7"/>
  <rect x="152" y="125" width="18" height="14" rx="1" fill="#FFECB3" stroke="#FFB300" stroke-width="1" transform="rotate(15 161 132)" opacity="0.7"/>
  <!-- Eyes (more expressive) -->
  <ellipse cx="85" cy="105" rx="7" ry="8" fill="#5D4037"/>
  <ellipse cx="115" cy="105" rx="7" ry="8" fill="#5D4037"/>
  <ellipse cx="87" cy="102" rx="3" ry="3.5" fill="white"/>
  <ellipse cx="117" cy="102" rx="3" ry="3.5" fill="white"/>
  <ellipse cx="85" cy="105" rx="3" ry="3" fill="#3E2723"/>
  <ellipse cx="115" cy="105" rx="3" ry="3" fill="#3E2723"/>
  <!-- Blush -->
  <ellipse cx="72" cy="118" rx="9" ry="5" fill="#FF8A80" opacity="0.35"/>
  <ellipse cx="128" cy="118" rx="9" ry="5" fill="#FF8A80" opacity="0.35"/>
  <!-- Smile -->
  <path d="M92 125 Q100 132 108 125" fill="none" stroke="#8D6E63" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Brush pen -->
  <line x1="155" y1="85" x2="175" y2="45" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="175" cy="43" r="4" fill="#5D4037"/>
  <!-- Stage badge on forehead -->
  <ellipse cx="100" cy="82" rx="10" ry="6" fill="#FF8F00" opacity="0.8"/>
  <text x="100" y="84" text-anchor="middle" fill="white" font-size="8" font-weight="bold">2</text>
</svg>

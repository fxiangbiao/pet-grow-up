<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 数学龙 - Math dragon -->
  <defs>
    <radialGradient id="body" cx="50%" cy="50%"><stop offset="0%" stop-color="#E3F2FD"/><stop offset="100%" stop-color="#90CAF9"/></radialGradient>
  </defs>
  <ellipse cx="100" cy="130" rx="80" ry="25" fill="#42A5F5" opacity="0.1"/>
  <!-- Body -->
  <ellipse cx="100" cy="115" rx="42" ry="48" fill="url(#body)" stroke="#1565C0" stroke-width="2.5"/>
  <!-- Dragon horns -->
  <path d="M75 75 L65 50 L80 68" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M125 75 L135 50 L120 68" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Wings -->
  <path d="M55 90 Q20 70 30 45 Q50 60 58 80" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/>
  <path d="M145 90 Q180 70 170 45 Q150 60 142 80" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="85" cy="105" rx="8" ry="9" fill="#0D47A1"/>
  <ellipse cx="115" cy="105" rx="8" ry="9" fill="#0D47A1"/>
  <ellipse cx="87" cy="102" rx="3.5" ry="4" fill="white"/>
  <ellipse cx="117" cy="102" rx="3.5" ry="4" fill="white"/>
  <ellipse cx="85" cy="105" rx="3.5" ry="5" fill="#0D47A1"/>
  <ellipse cx="115" cy="105" rx="3.5" ry="5" fill="#0D47A1"/>
  <!-- Angular geometric patterns on body -->
  <polygon points="85,130 100,125 115,130 100,140" fill="none" stroke="#64B5F6" stroke-width="1.5" opacity="0.8"/>
  <polygon points="90,140 100,136 110,140 100,146" fill="none" stroke="#64B5F6" stroke-width="1" opacity="0.6"/>
  <!-- Small flame by mouth -->
  <path d="M88 125 Q82 118 85 112" fill="none" stroke="#FF8F00" stroke-width="2" opacity="0.7"/>
  <path d="M112 125 Q118 118 115 112" fill="none" stroke="#FF8F00" stroke-width="2" opacity="0.7"/>
  <!-- Stage badge -->
  <rect x="92" y="75" width="16" height="12" rx="2" fill="#1565C0"/>
  <text x="100" y="83" text-anchor="middle" fill="white" font-size="8" font-weight="bold">2</text>
</svg>

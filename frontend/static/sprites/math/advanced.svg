<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 逻辑神 - Logic deity -->
  <defs>
    <radialGradient id="body" cx="50%" cy="50%"><stop offset="0%" stop-color="#E8EAF6"/><stop offset="100%" stop-color="#7986CB"/></radialGradient>
  </defs>
  <ellipse cx="100" cy="135" rx="85" ry="30" fill="#3F51B5" opacity="0.08"/>
  <!-- Grand body -->
  <ellipse cx="100" cy="120" rx="50" ry="55" fill="url(#body)" stroke="#283593" stroke-width="3"/>
  <!-- Geometric halo -->
  <circle cx="100" cy="75" r="35" fill="none" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <circle cx="100" cy="75" r="28" fill="none" stroke="#7986CB" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <!-- Hexagon on chest -->
  <polygon points="100,125 110,130 110,140 100,145 90,140 90,130" fill="none" stroke="#5C6BC0" stroke-width="2" opacity="0.7"/>
  <polygon points="100,129 106,132 106,138 100,141 94,138 94,132" fill="#7986CB" opacity="0.3"/>
  <!-- Eyes -->
  <ellipse cx="85" cy="108" rx="8" ry="9" fill="#1A237E"/>
  <ellipse cx="115" cy="108" rx="8" ry="9" fill="#1A237E"/>
  <ellipse cx="87" cy="105" rx="3.5" ry="4" fill="white"/>
  <ellipse cx="117" cy="105" rx="3.5" ry="4" fill="white"/>
  <circle cx="83" cy="106" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="113" cy="106" r="1.5" fill="white" opacity="0.9"/>
  <!-- Wise expression -->
  <path d="M90 125 Q100 132 110 125" fill="none" stroke="#283593" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wings -->
  <path d="M48 95 Q10 70 20 40 Q48 65 50 85" fill="#C5CAE9" stroke="#3949AB" stroke-width="2"/>
  <path d="M152 95 Q190 70 180 40 Q152 65 150 85" fill="#C5CAE9" stroke="#3949AB" stroke-width="2"/>
  <!-- Geometric formulas floating -->
  <text x="25" y="100" fill="#5C6BC0" font-size="8" opacity="0.5" font-family="serif">Σ</text>
  <text x="168" y="95" fill="#5C6BC0" font-size="8" opacity="0.5" font-family="serif">π</text>
  <text x="30" y="130" fill="#5C6BC0" font-size="7" opacity="0.4" font-family="serif">∫</text>
  <text x="162" y="135" fill="#5C6BC0" font-size="7" opacity="0.4" font-family="serif">√</text>
  <text x="100" y="80" text-anchor="middle" fill="#1A237E" font-size="9" font-weight="bold">3</text>
</svg>

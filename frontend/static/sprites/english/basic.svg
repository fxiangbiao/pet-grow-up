<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 小巫师 - Little wizard -->
  <defs>
    <radialGradient id="body" cx="50%" cy="50%"><stop offset="0%" stop-color="#F3E5F5"/><stop offset="100%" stop-color="#E1BEE7"/></radialGradient>
  </defs>
  <ellipse cx="100" cy="120" rx="70" ry="20" fill="#AB47BC" opacity="0.1"/>
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="38" ry="40" fill="url(#body)" stroke="#7B1FA2" stroke-width="2"/>
  <!-- Wizard hat -->
  <path d="M68 88 L100 35 L132 88" fill="#7B1FA2" stroke="#4A148C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="65" y="85" width="70" height="7" rx="3" fill="#4A148C"/>
  <!-- Star on hat -->
  <polygon points="100,48 103,56 112,56 105,61 107,70 100,65 93,70 95,61 88,56 97,56" fill="#FFD54F"/>
  <!-- Eyes -->
  <ellipse cx="85" cy="112" rx="6" ry="7" fill="#4A148C"/>
  <ellipse cx="115" cy="112" rx="6" ry="7" fill="#4A148C"/>
  <ellipse cx="87" cy="110" rx="2.5" ry="3" fill="white"/>
  <ellipse cx="117" cy="110" rx="2.5" ry="3" fill="white"/>
  <ellipse cx="85" cy="112" rx="2.5" ry="3" fill="#6A1B9A"/>
  <ellipse cx="115" cy="112" rx="2.5" ry="3" fill="#6A1B9A"/>
  <!-- Blush -->
  <ellipse cx="75" cy="122" rx="7" ry="4" fill="#CE93D8" opacity="0.5"/>
  <ellipse cx="125" cy="122" rx="7" ry="4" fill="#CE93D8" opacity="0.5"/>
  <!-- Smile -->
  <path d="M93 127 Q100 133 107 127" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Magic wand -->
  <line x1="145" y1="100" x2="168" y2="60" stroke="#6A1B9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="57" r="5" fill="#FFD54F"/>
  <circle cx="170" cy="57" r="8" fill="#FFD54F" opacity="0.3"/>
  <!-- Tiny stars -->
  <text x="160" y="75" fill="#FFD54F" font-size="10" opacity="0.7">✦</text>
  <text x="155" y="55" fill="#CE93D8" font-size="8" opacity="0.5">✦</text>
</svg>
